  function bindEvents() {

  function render() {
    syncControls();
    const queryIntent = parseNaturalQuery(state.query);
    const filtered = rankRecords(records.filter((item) => matchesFilters(item, queryIntent)), queryIntent);
    if (!filtered.some((item) => item.id === state.selectedId)) {
      state.selectedId = filtered[0]?.id || "";
    }
    renderStats(filtered, queryIntent);
    renderActiveFilters(filtered.length, queryIntent);
    renderResults(filtered);
    renderDetail();
    renderCompare();
  }

  function syncControls() {
    els.weightValue.textContent = state.maxWeight >= 3 ? "不限" : `${state.maxWeight.toFixed(2)} kg`;
    els.batteryValue.textContent = state.minBattery <= 0 ? "不限" : `${state.minBattery} Wh 以上`;
    els.weightRange.value = String(state.maxWeight);
    els.batteryRange.value = String(state.minBattery);
    els.sortSelect.value = state.sort;
    els.tableViewBtn.classList.toggle("is-active", state.view === "table");
    els.cardViewBtn.classList.toggle("is-active", state.view === "card");
    els.tableView.classList.toggle("is-hidden", state.view !== "table");
    els.cardView.classList.toggle("is-hidden", state.view !== "card");

    for (const button of els.sheetTabs.querySelectorAll("button[data-sheet]")) {
      button.classList.toggle("is-active", button.dataset.sheet === state.sheet);
    }
    for (const input of els.brandFilters.querySelectorAll("input[type='checkbox']")) {
      input.checked = state.brands.has(input.value);
    }
    for (const input of els.flagFilters.querySelectorAll("input[type='checkbox']")) {
      input.checked = state.flags.has(input.value);
    }
  }

  function matchesFilters(item, queryIntent) {
    if (queryIntent.raw && !matchesNaturalQuery(item, queryIntent)) return false;
    if (state.sheet !== "all" && item[fields.sheet] !== state.sheet) return false;
    if (state.brands.size && !state.brands.has(String(item[fields.brand] || ""))) return false;
    if (state.series !== "all" && item[fields.series] !== state.series) return false;
    if (state.platform !== "all" && item[fields.cpu] !== state.platform) return false;
    if (state.graphics !== "all" && item[fields.graphics] !== state.graphics) return false;
    if (state.screen !== "all") {
      const wanted = Number(state.screen);
      if (!item._derived.screenValues.some((value) => Math.abs(value - wanted) < 0.01)) return false;
    }
    if (state.maxWeight < 3) {
      const weight = item._metrics?.weightMin;
      if (weight == null || weight > state.maxWeight) return false;
    }
    if (state.minBattery > 0) {
      const battery = item._metrics?.batteryMax;
      if (battery == null || battery < state.minBattery) return false;
    }
    for (const flag of state.flags) {
      if (!item._flags?.[flag]) return false;
    }
    return true;
  }

  function parseNaturalQuery(rawQuery) {
    const raw = normalizeQuery(rawQuery);
    const intent = {
      raw,
      labels: [],
      brands: [],
      excludeBrands: [],
      flags: [],
      excludeFlags: [],
      exactScreens: [],
      minScreen: null,
      maxScreen: null,
      maxWeight: null,
      minBattery: null,
      maxThickness: null,
      rank: null,
      fieldGroups: [],
      terms: [],
    };
    if (!raw) return intent;

    let remaining = ` ${raw} `;
    const addLabel = (label) => {
      if (label && !intent.labels.includes(label)) intent.labels.push(label);
    };
    const consume = (pattern, callback) => {
      remaining = remaining.replace(pattern, (...args) => {
        callback(args);
        return " ";
      });
    };
    const setMax = (key, value) => {
      if (!Number.isFinite(value)) return;
      intent[key] = intent[key] == null ? value : Math.min(intent[key], value);
    };
    const setMin = (key, value) => {
      if (!Number.isFinite(value)) return;
      intent[key] = intent[key] == null ? value : Math.max(intent[key], value);
    };
    const setRank = (rank, label, termsToRemove = []) => {
      if (intent.rank) return;
      if (rank.metric === "weightMin") rank.screenContext = intent.exactScreens;
      intent.rank = rank;
      addLabel(label);
      for (const term of termsToRemove) {
        remaining = removeTerm(remaining, term);
      }
    };

    if (/(最輕|最輕量|重量最低|最便攜|最適合攜帶|最方便帶)/i.test(raw)) {
      setRank({ metric: "weightMin", direction: "asc", bestOnly: true }, "最輕", [
        "最輕",
        "最輕量",
        "重量最低",
        "最便攜",
        "最適合攜帶",
        "最方便帶",
      ]);
    } else if (/(比較輕|較輕|輕一點|重量較低|重量低)/i.test(raw)) {
      setRank({ metric: "weightMin", direction: "asc", bestOnly: false }, "重量由輕到重", [
        "比較輕",
        "較輕",
        "輕一點",
        "重量較低",
        "重量低",
      ]);
    }

    if (/(最薄|厚度最低|最薄型|最薄的)/i.test(raw)) {
      setRank({ metric: "thicknessMax", direction: "asc", bestOnly: true }, "最薄", [
        "最薄",
        "厚度最低",
        "最薄型",
        "最薄的",
      ]);
    } else if (/(比較薄|較薄|薄一點|厚度較低)/i.test(raw)) {
      setRank({ metric: "thicknessMax", direction: "asc", bestOnly: false }, "厚度由薄到厚", [
        "比較薄",
        "較薄",
        "薄一點",
        "厚度較低",
      ]);
    }

    if (/(電池最大|電池最高|最大電池|續航最長|最長續航|電池最久|電量最大)/i.test(raw)) {
      setRank({ metric: "batteryMax", direction: "desc", bestOnly: true }, "電池最大", [
        "電池最大",
        "電池最高",
        "最大電池",
        "續航最長",
        "最長續航",
        "電池最久",
        "電量最大",
      ]);
    } else if (/(電池較大|比較大電池|續航較長|電池多一點)/i.test(raw)) {
      setRank({ metric: "batteryMax", direction: "desc", bestOnly: false }, "電池由大到小", [
        "電池較大",
        "比較大電池",
        "續航較長",
        "電池多一點",
      ]);
    }

    if (/(最大螢幕|螢幕最大|尺寸最大|最大的螢幕|最大尺寸)/i.test(raw)) {
      setRank({ metric: "screenMax", direction: "desc", bestOnly: true }, "螢幕最大", [
        "最大螢幕",
        "螢幕最大",
        "尺寸最大",
        "最大的螢幕",
        "最大尺寸",
      ]);
    } else if (/(最小螢幕|螢幕最小|尺寸最小|最小尺寸)/i.test(raw)) {
      setRank({ metric: "screenMin", direction: "asc", bestOnly: true }, "螢幕最小", [
        "最小螢幕",
        "螢幕最小",
        "尺寸最小",
        "最小尺寸",
      ]);
    }

    if (/(最新|最近更新|更新最新)/i.test(raw)) {
      setRank({ metric: "updated", direction: "desc", bestOnly: true }, "最新更新", [
        "最新",
        "最近更新",
        "更新最新",
      ]);
    }

    for (const brand of uniqueValues(fields.brand)) {
      const negative = new RegExp(`(?:不要|排除|不含|非|不是|not|without|no)\\s*${escapeRegExp(brand)}`, "gi");
      if (negative.test(raw)) {
        intent.excludeBrands.push(brand);
        addLabel(`排除 ${brand}`);
        remaining = remaining.replace(negative, " ");
      } else if (containsTerm(raw, brand)) {
        intent.brands.push(brand);
        addLabel(`品牌 ${brand}`);
        remaining = removeTerm(remaining, brand);
      }
    }

    for (const flag of flagSynonyms) {
      let positive = false;
      let negative = false;
      for (const term of flag.terms) {
        const negativePattern = new RegExp(`(?:不要|排除|不含|沒有|無|without|no)\\s*${escapeRegExp(term)}`, "gi");
        if (negativePattern.test(raw)) {
          negative = true;
          remaining = remaining.replace(negativePattern, " ");
        } else if (containsTerm(raw, term)) {
          positive = true;
          remaining = removeTerm(remaining, term);
        }
      }
      if (negative) {
        intent.excludeFlags.push(flag.key);
        addLabel(`排除 ${flag.label}`);
      } else if (positive) {
        intent.flags.push(flag.key);
        addLabel(flag.label);
      }
    }

    consume(/(\d+(?:\.\d+)?)\s*(?:到|-|~)\s*(\d+(?:\.\d+)?)\s*(?:吋|"|inches|inch|in)(?=$|\s|[^a-z0-9])/gi, (match) => {
      const low = Number(match[1]);
      const high = Number(match[2]);
      setMin("minScreen", Math.min(low, high));
      setMax("maxScreen", Math.max(low, high));
      addLabel(`${Math.min(low, high)}-${Math.max(low, high)} 吋`);
    });

    consume(/(?:螢幕|尺寸|screen)?\s*(?:(至少|大於|高於|>=|不少於|以上|不小於|小於|低於|<=|以下|不超過|最多)\s*)?(\d+(?:\.\d+)?)\s*(?:吋|"|inches|inch|in)(?=$|\s|[^a-z0-9])\s*(至少|大於|高於|>=|不少於|以上|不小於|小於|低於|<=|以下|不超過|最多)?/gi, (match) => {
      const comparator = match[1] || match[3] || "";
      const value = Number(match[2]);
      if (isLowerBound(comparator)) {
        setMin("minScreen", value);
        addLabel(`螢幕 >= ${value} 吋`);
      } else if (isUpperBound(comparator)) {
        setMax("maxScreen", value);
        addLabel(`螢幕 <= ${value} 吋`);
      } else {
        intent.exactScreens.push(value);
        addLabel(`${value} 吋`);
      }
    });

    consume(/(?:重量|重|weight|輕於|低於|小於|不超過|最多)?\s*(\d+(?:\.\d+)?)\s*(?:kg|公斤|千克)\s*(?:以下|以內|內|最多|不超過|小於|低於)?/gi, (match) => {
      const value = Number(match[1]);
      setMax("maxWeight", value);
      addLabel(`重量 <= ${value} kg`);
    });

    consume(/(?:重量|重|weight|輕於|低於|小於|不超過|最多)\s*(\d+(?:\.\d+)?)/gi, (match) => {
      const value = Number(match[1]);
      setMax("maxWeight", value);
      addLabel(`重量 <= ${value} kg`);
    });

    consume(/(?:電池|battery|續航)\s*(?:容量)?\s*(?:至少|大於|高於|>=|不少於|超過)?\s*(\d+(?:\.\d+)?)\s*(?:wh|瓦時)?/gi, (match) => {
      const value = Number(match[1]);
      setMin("minBattery", value);
      addLabel(`電池 >= ${value} Wh`);
    });

    consume(/(\d+(?:\.\d+)?)\s*(?:wh|瓦時)\s*(?:以上|起|至少|不少於|>=|大於|高於)?/gi, (match) => {
      const value = Number(match[1]);
      setMin("minBattery", value);
      addLabel(`電池 >= ${value} Wh`);
    });

    consume(/(?:厚度|機身|薄於|低於|小於|不超過)\s*(\d+(?:\.\d+)?)\s*(?:mm|毫米)?/gi, (match) => {
      const value = Number(match[1]);
      setMax("maxThickness", value);
      addLabel(`厚度 <= ${value} mm`);
    });

    if (/(?:厚|薄)/.test(raw)) {
      consume(/(\d+(?:\.\d+)?)\s*(?:mm|毫米)\s*(?:以下|以內|內|最多|不超過|小於|低於)/gi, (match) => {
        const value = Number(match[1]);
        setMax("maxThickness", value);
        addLabel(`厚度 <= ${value} mm`);
      });
    }

    if (containsTerm(raw, "超輕")) {
      setMax("maxWeight", 1.15);
      addLabel("超輕量");
      remaining = removeTerm(remaining, "超輕");
    } else if (containsTerm(raw, "輕薄") || containsTerm(raw, "輕量")) {
      setMax("maxWeight", 1.4);
      addLabel("輕薄 / 輕量");
      remaining = removeTerm(removeTerm(remaining, "輕薄"), "輕量");
    }
    if (containsTerm(raw, "大電池") || containsTerm(raw, "長續航")) {
      setMin("minBattery", 70);
      addLabel("大電池");
      remaining = removeTerm(removeTerm(remaining, "大電池"), "長續航");
    }
    if (containsTerm(raw, "大螢幕")) {
      setMin("minScreen", 15);
      addLabel("大螢幕");
      remaining = removeTerm(remaining, "大螢幕");
    }
    if (containsTerm(raw, "小尺寸") || containsTerm(raw, "便攜")) {
      setMax("maxScreen", 14);
      addLabel("小尺寸");
      remaining = removeTerm(removeTerm(remaining, "小尺寸"), "便攜");
    }

    addFieldGroup(raw, remaining, intent, "Intel", [fields.cpu], ["intel"]);
    addFieldGroup(raw, remaining, intent, "AMD", [fields.cpu], ["amd", "ryzen"]);
    addFieldGroup(raw, remaining, intent, "Core Ultra", [fields.cpu], ["core ultra"]);
    addFieldGroup(raw, remaining, intent, "RTX / NVIDIA", [fields.graphics], ["rtx", "nvidia", "geforce"]);
    addFieldGroup(raw, remaining, intent, "Radeon", [fields.graphics], ["radeon"]);
    addFieldGroup(raw, remaining, intent, "Intel Arc", [fields.graphics], ["arc"]);

    remaining = normalizeQuery(remaining.replace(/[()（）:：/\\|]/g, " "));
    for (const word of fillerWords) {
      remaining = removeTerm(remaining, word);
    }

    for (const term of semanticTerms) {
      if (containsTerm(raw, term) && !["輕薄", "輕量"].includes(term)) {
        intent.terms.push(term);
        remaining = removeTerm(remaining, term);
      }
    }

    const residualTerms = remaining
      .split(/\s+/)
      .map((part) => part.trim())
      .filter((part) => part.length > 1)
      .filter((part) => !/^\d+(?:\.\d+)?$/.test(part))
      .filter((part) => !["kg", "wh", "mm", "inch"].includes(part));

    for (const term of residualTerms) {
      if (!intent.terms.includes(term)) intent.terms.push(term);
    }

    return intent;
  }

  function matchesNaturalQuery(item, intent) {
    const brand = String(item[fields.brand] || "");
    if (intent.brands.length && !intent.brands.includes(brand)) return false;
    if (intent.excludeBrands.includes(brand)) return false;

    for (const flag of intent.flags) {
      if (!item._flags?.[flag]) return false;
    }
    for (const flag of intent.excludeFlags) {
      if (item._flags?.[flag]) return false;
    }

    if (intent.exactScreens.length) {
      const hasScreen = intent.exactScreens.some((wanted) =>
        item._derived.screenValues.some((value) => Math.abs(value - wanted) < 0.01),
      );
      if (!hasScreen) return false;
    }
    if (intent.minScreen != null && (item._metrics?.screenMax == null || item._metrics.screenMax < intent.minScreen)) {
      return false;
    }
    if (intent.maxScreen != null && (item._metrics?.screenMin == null || item._metrics.screenMin > intent.maxScreen)) {
      return false;
    }
    if (intent.maxWeight != null && (item._metrics?.weightMin == null || item._metrics.weightMin > intent.maxWeight)) {
      return false;
    }
    if (intent.minBattery != null && (item._metrics?.batteryMax == null || item._metrics.batteryMax < intent.minBattery)) {
      return false;
    }
    if (intent.maxThickness != null && (item._metrics?.thicknessMax == null || item._metrics.thicknessMax > intent.maxThickness)) {
      return false;
    }

    for (const group of intent.fieldGroups) {
      const target = group.keys.map((key) => String(item[key] || "").toLowerCase()).join(" ");
      if (!group.terms.some((term) => target.includes(term))) return false;
    }

    for (const term of intent.terms) {
      if (!item._derived.searchText.includes(term.toLowerCase())) return false;
    }

    return true;
  }

  function rankRecords(list, queryIntent) {
    const sorted = sortRecords(list, queryIntent);
    if (!queryIntent.rank?.bestOnly) return sorted;
    const bestValue = sorted.map((item) => rankValue(item, queryIntent.rank)).find(Number.isFinite);
    if (bestValue == null) return sorted;
    return sorted.filter((item) => Math.abs(rankValue(item, queryIntent.rank) - bestValue) < 0.0001);
  }

  function sortRecords(list, queryIntent = null) {
    const next = [...list];
    next.sort((a, b) => {
      if (queryIntent?.rank) {
        const ranked = compareRank(a, b, queryIntent.rank);
        if (ranked !== 0) return ranked;
      }
      if (state.sort === "weight") return metric(a, "weightMin", Infinity) - metric(b, "weightMin", Infinity);
      if (state.sort === "battery") return metric(b, "batteryMax", -Infinity) - metric(a, "batteryMax", -Infinity);
      if (state.sort === "screen") return metric(a, "screenMin", Infinity) - metric(b, "screenMin", Infinity);
      if (state.sort === "updated") return String(b[fields.updated] || "").localeCompare(String(a[fields.updated] || ""));
      return (
        text(a[fields.brand]).localeCompare(text(b[fields.brand]), "zh-Hant") ||
        text(a[fields.series]).localeCompare(text(b[fields.series]), "zh-Hant") ||
        text(a[fields.model]).localeCompare(text(b[fields.model]), "zh-Hant")
      );
    });
    return next;
  }

  function compareRank(a, b, rank) {
    const av = rankValue(a, rank);
    const bv = rankValue(b, rank);
    const aMissing = !Number.isFinite(av);
    const bMissing = !Number.isFinite(bv);
    if (aMissing && bMissing) return 0;
    if (aMissing) return 1;
    if (bMissing) return -1;
    return rank.direction === "asc" ? av - bv : bv - av;
  }

  function rankValue(item, rank) {
    if (rank.metric === "updated") {
      const time = Date.parse(item[fields.updated] || "");
      return Number.isFinite(time) ? time : NaN;
    }
    if (rank.metric === "weightMin" && rank.screenContext?.length && item._derived?.screenValues?.length > 1) {
      const wanted = rank.screenContext[0];
      const screens = item._derived.screenValues;
      const maxScreen = Math.max(...screens);
      const minScreen = Math.min(...screens);
      if (Math.abs(wanted - maxScreen) < 0.01) {
        return item._metrics?.weightMax ?? item._metrics?.weightMin ?? NaN;
      }
      if (Math.abs(wanted - minScreen) < 0.01) {
        return item._metrics?.weightMin ?? item._metrics?.weightMax ?? NaN;
      }
    }
    const value = item._metrics?.[rank.metric];
    return typeof value === "number" ? value : NaN;
  }

  function comparableWeight(item, queryIntent) {
    if (queryIntent?.exactScreens?.length) {
      return rankValue(item, {
        metric: "weightMin",
        direction: "asc",
        screenContext: queryIntent.exactScreens,
      });
    }
    return item._metrics?.weightMin ?? NaN;
  }

  function renderStats(items, queryIntent = null) {
    els.statTotal.textContent = String(items.length);
    const brandCounts = countBy(items, fields.brand);
    els.statBrands.textContent = Object.entries(brandCounts)
      .map(([brand, count]) => `${brand} ${count}`)
      .join(" / ") || "-";

    const lightest = [...items]
      .filter((item) => Number.isFinite(comparableWeight(item, queryIntent)))
      .sort((a, b) => comparableWeight(a, queryIntent) - comparableWeight(b, queryIntent))[0];
    els.statLightest.textContent = lightest
      ? `${lightest[fields.brand]} ${lightest[fields.model]} ${comparableWeight(lightest, queryIntent)} kg`
      : "-";

    const battery = [...items]
      .filter((item) => item._metrics?.batteryMax != null)
      .sort((a, b) => b._metrics.batteryMax - a._metrics.batteryMax)[0];
    els.statBattery.textContent = battery
      ? `${battery[fields.brand]} ${battery[fields.model]} ${battery._metrics.batteryMax} Wh`
      : "-";
  }

  function renderActiveFilters(count, queryIntent) {
    const labels = [];
    if (state.query) {
      labels.push(`搜尋「${state.query}」`);
      if (queryIntent.labels.length) labels.push(queryIntent.labels.join(" / "));
    }
    if (state.sheet !== "all") labels.push(state.sheet);
    if (state.brands.size) labels.push(`品牌 ${Array.from(state.brands).join(" / ")}`);
    if (state.series !== "all") labels.push(`系列 ${state.series}`);
    if (state.screen !== "all") labels.push(`${state.screen} 吋`);
    if (state.platform !== "all") labels.push(`平台 ${state.platform}`);
    if (state.graphics !== "all") labels.push(`顯示 ${state.graphics}`);
    if (state.maxWeight < 3) labels.push(`最低重量 <= ${state.maxWeight.toFixed(2)} kg`);
    if (state.minBattery > 0) labels.push(`電池 >= ${state.minBattery} Wh`);
    if (state.flags.size) {
      const names = flagOptions.filter((flag) => state.flags.has(flag.key)).map((flag) => flag.label);
      labels.push(names.join(" / "));
    }
    els.resultCount.textContent = `${count} 筆結果`;
    els.activeFilters.textContent = labels.length ? labels.join(" | ") : "尚未套用篩選";
  }

  function renderResults(items) {
    const hasItems = items.length > 0;
    els.emptyState.classList.toggle("is-hidden", hasItems);
    els.tableView.classList.toggle("is-hidden", !hasItems || state.view !== "table");
    els.cardView.classList.toggle("is-hidden", !hasItems || state.view !== "card");
    renderRows(items);
    renderCards(items);
  }

  function renderRows(items) {
    els.resultRows.innerHTML = items
      .map((item) => {
        const selected = item.id === state.selectedId ? " is-selected" : "";
        const checked = state.compare.has(item.id) ? "checked" : "";
        return `
          <tr class="${selected}" data-id="${escapeAttr(item.id)}">
            <td class="compare-cell">
              <input type="checkbox" data-compare="${escapeAttr(item.id)}" ${checked} aria-label="加入比較 ${escapeAttr(item[fields.name])}">
            </td>
            <td>
              <strong>${escapeHtml(item[fields.brand])}</strong>
              <div class="badge-line"><span class="badge source">${escapeHtml(item[fields.sheet])}</span></div>
            </td>
            <td>
              <strong>${escapeHtml(item[fields.series])}</strong>
              <div class="muted mini">${escapeHtml(item[fields.model])}</div>
            </td>
            <td>
              <span class="product-name">${escapeHtml(item[fields.name])}</span>
              <div class="muted mini">${escapeHtml(item[fields.position])}</div>
            </td>
            <td>${twoLine(item[fields.screen], item[fields.resolution])}</td>
            <td>${escapeHtml(item[fields.weight])}</td>
            <td>${escapeHtml(item[fields.battery])}</td>
            <td>${twoLine(item[fields.cpu], item[fields.graphics])}</td>
            <td>${escapeHtml(item[fields.ports])}</td>
          </tr>
        `;
      })
      .join("");
  }

  function renderCards(items) {
    els.cardView.innerHTML = items
      .map((item) => {
        const selected = item.id === state.selectedId ? " is-selected" : "";
        const checked = state.compare.has(item.id) ? "checked" : "";
        return `
          <article class="product-card${selected}" data-id="${escapeAttr(item.id)}">
            <div class="card-top">
              <div>
                <h2 class="card-title">${escapeHtml(item[fields.name])}</h2>
                <p class="card-meta">${escapeHtml(item[fields.brand])} | ${escapeHtml(item[fields.series])} | ${escapeHtml(item[fields.model])}</p>
              </div>
              <label class="mini">
                <input type="checkbox" data-compare="${escapeAttr(item.id)}" ${checked}>
                比較
              </label>
            </div>
            <div class="spec-grid">
              ${specBox("螢幕", item[fields.screen])}
              ${specBox("重量", item[fields.weight])}
              ${specBox("電池", item[fields.battery])}
              ${specBox("平台", item[fields.cpu])}
            </div>
            <div class="badge-line">
              ${renderBadges(item)}
            </div>
          </article>
        `;
      })
      .join("");
  }

  function renderDetail() {
    const item = findById(state.selectedId);
    if (!item) {
      els.detailPanel.innerHTML = '<p class="detail-placeholder">選取左側任一筆資料即可查看完整參數。</p>';
      return;
    }

    const compareLabel = state.compare.has(item.id) ? "已加入比較" : "加入比較";
    const url = item[fields.url];
    els.detailPanel.innerHTML = `
      <div class="detail-header">
        <div>
          <div class="badge-line">
            <span class="badge">${escapeHtml(item[fields.brand])}</span>
            <span class="badge source">${escapeHtml(item[fields.sheet])}</span>
            ${renderBadges(item)}
          </div>
          <h2>${escapeHtml(item[fields.name])}</h2>
          <p class="muted">${escapeHtml(item[fields.series])} | ${escapeHtml(item[fields.model])}</p>
        </div>
        <div class="detail-actions">
          ${url ? `<a class="link-button" href="${escapeAttr(url)}" target="_blank" rel="noreferrer">產品頁</a>` : ""}
          <button class="button ghost" type="button" data-copy="${escapeAttr(item.id)}">複製規格</button>
          <button class="button ghost" type="button" data-detail-compare="${escapeAttr(item.id)}">${compareLabel}</button>
        </div>
      </div>
      ${detailGroups.map((group) => renderDetailGroup(group, item)).join("")}
    `;
  }

  function renderDetailGroup(group, item) {
    const entries = group.keys
      .filter((key) => item[key] != null && item[key] !== "")
      .map((key) => `
        <div>
          <dt>${escapeHtml(key)}</dt>
          <dd>${linkify(key, item[key])}</dd>
        </div>
      `)
      .join("");
    if (!entries) return "";
    return `
      <section class="detail-section">
        <h3>${escapeHtml(group.title)}</h3>
        <dl class="detail-list">${entries}</dl>
      </section>
    `;
  }

  function renderCompare() {
    const items = Array.from(state.compare).map(findById).filter(Boolean);
    els.comparePanel.classList.toggle("is-hidden", items.length === 0);
    if (!items.length) {
      els.comparePanel.innerHTML = "";
      return;
    }
    els.comparePanel.innerHTML = `
      <div class="compare-head">
        <h2>比較 ${items.length} 款機種</h2>
        <span class="muted mini">最多可同時比較 4 款</span>
      </div>
      <div class="compare-table-wrap">
        <table class="compare-table">
          <thead>
            <tr>
              <th>參數</th>
              ${items
                .map(
                  (item) => `
                    <th>
                      ${escapeHtml(item[fields.brand])} ${escapeHtml(item[fields.model])}
                      <button class="remove-link" type="button" data-remove-compare="${escapeAttr(item.id)}">移除</button>
                    </th>
                  `,
                )
                .join("")}
            </tr>
          </thead>
          <tbody>
            ${compareFields
              .map(
                (key) => `
                  <tr>
                    <th>${escapeHtml(key)}</th>
                    ${items.map((item) => `<td>${linkify(key, item[key] ?? "-")}</td>`).join("")}
                  </tr>
                `,
              )
              .join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  function resetFilters() {
    state.query = "";
    state.sheet = "all";
    state.brands.clear();
    state.series = "all";
    state.screen = "all";
    state.platform = "all";
    state.graphics = "all";
    state.flags.clear();
    state.maxWeight = 3;
    state.minBattery = 0;
    state.sort = "brand";
    state.view = "table";
    els.searchInput.value = "";
    els.seriesSelect.value = "all";
    els.screenSelect.value = "all";
    els.platformSelect.value = "all";
    els.graphicsSelect.value = "all";
    render();
  }

  function exportCsv() {
    const queryIntent = parseNaturalQuery(state.query);
    const items = rankRecords(records.filter((item) => matchesFilters(item, queryIntent)), queryIntent);
    const exportFields = payload.metadata.columns || compareFields;
    const rows = [
      exportFields,
      ...items.map((item) => exportFields.map((key) => item[key] ?? "")),
    ];
    const csv = "\ufeff" + rows.map((row) => row.map(csvCell).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "商用筆電查詢結果.csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  function buildSheetTabs() {
    const sheets = payload.metadata.sheets || uniqueValues(fields.sheet);
    const options = [{ value: "all", label: "全部" }, ...sheets.map((sheet) => ({ value: sheet, label: sheet }))];
    els.sheetTabs.innerHTML = options
      .map((option) => `<button type="button" data-sheet="${escapeAttr(option.value)}">${escapeHtml(option.label)}</button>`)
      .join("");
  }

  function buildBrandFilters() {
    const counts = countBy(records, fields.brand);
    els.brandFilters.innerHTML = Object.entries(counts)
      .sort(([a], [b]) => a.localeCompare(b, "zh-Hant"))
      .map(
        ([brand, count]) => `
          <label class="checkbox-row">
            <input type="checkbox" value="${escapeAttr(brand)}">
            <span>${escapeHtml(brand)}</span>
            <span class="count-pill">${count}</span>
          </label>
        `,
      )
      .join("");
  }

  function buildFlagFilters() {
    els.flagFilters.innerHTML = flagOptions
      .map(
        (flag) => `
          <label class="chip-row">
            <input type="checkbox" value="${escapeAttr(flag.key)}">
            <span>${escapeHtml(flag.label)}</span>
          </label>
        `,
      )
      .join("");
  }

  function fillSelect(select, firstLabel, values) {
    const normalized = values.map((entry) =>
      typeof entry === "object" ? entry : { value: entry, label: entry },
    );
    select.innerHTML = [
      `<option value="all">${escapeHtml(firstLabel)}</option>`,
      ...normalized.map((entry) => `<option value="${escapeAttr(entry.value)}">${escapeHtml(entry.label)}</option>`),
    ].join("");
  }

  function toggleCompare(id, shouldAdd) {
    if (!id) return;
    if (shouldAdd && !state.compare.has(id) && state.compare.size >= 4) {
      window.alert("最多可同時比較 4 款機種。");
      render();
      return;
    }
    if (shouldAdd) state.compare.add(id);
    else state.compare.delete(id);
    render();
  }

  async function copySummary(item, button) {
    if (!item) return;
    const textToCopy = [
      `${item[fields.brand] || ""} ${item[fields.series] || ""} ${item[fields.model] || ""}`,
      `產品名稱: ${item[fields.name] || ""}`,
      `螢幕: ${item[fields.screen] || ""} / ${item[fields.resolution] || ""}`,
      `重量: ${item[fields.weight] || ""}`,
      `電池: ${item[fields.battery] || ""}`,
      `CPU: ${item[fields.cpu] || ""}`,
      `Graphics: ${item[fields.graphics] || ""}`,
      `I/O: ${item[fields.ports] || ""}`,
      `核心賣點: ${item[fields.selling] || ""}`,
    ].join("\n");
    try {
      await navigator.clipboard.writeText(textToCopy);
      button.textContent = "已複製";
      setTimeout(() => {
        button.textContent = "複製規格";
      }, 1200);
    } catch {
      window.prompt("複製以下規格", textToCopy);
    }
  }

  function uniqueValues(key) {
    return Array.from(new Set(records.map((item) => item[key]).filter(Boolean))).sort((a, b) =>
      String(a).localeCompare(String(b), "zh-Hant"),
    );
  }

  function uniqueScreenValues() {
    return Array.from(new Set(records.flatMap((item) => item._derived.screenValues)))
      .filter((value) => value > 0 && value < 30)
      .sort((a, b) => a - b);
  }

  function countBy(items, key) {
    return items.reduce((acc, item) => {
      const value = item[key] || "未分類";
      acc[value] = (acc[value] || 0) + 1;
      return acc;
    }, {});
  }

  function findById(id) {
    return records.find((item) => item.id === id);
  }

  function metric(item, key, fallback) {
    const value = item._metrics?.[key];
    return value == null ? fallback : value;
  }

  function normalizeQuery(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[，,。；;、]/g, " ")
      .replace(/[＋+]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function containsTerm(source, term) {
    const normalizedSource = normalizeQuery(source);
    const normalizedTerm = normalizeQuery(term);
    if (!normalizedTerm) return false;
    if (/^[a-z0-9][a-z0-9 .+-]*$/i.test(normalizedTerm)) {
      const pattern = new RegExp(`(^|[^a-z0-9])${escapeRegExp(normalizedTerm)}(?=$|[^a-z0-9])`, "i");
      return pattern.test(normalizedSource);
    }
    return normalizedSource.includes(normalizedTerm);
  }

  function removeTerm(source, term) {
    const normalizedTerm = normalizeQuery(term);
    if (!normalizedTerm) return source;
    if (/^[a-z0-9][a-z0-9 .+-]*$/i.test(normalizedTerm)) {
      const pattern = new RegExp(`(^|[^a-z0-9])${escapeRegExp(normalizedTerm)}(?=$|[^a-z0-9])`, "gi");
      return source.replace(pattern, " ");
    }
    return source.replaceAll(normalizedTerm, " ");
  }

  function isLowerBound(value) {
    return /至少|大於|高於|>=|不少於|以上|不小於/.test(value || "");
  }

  function isUpperBound(value) {
    return /小於|低於|<=|以下|不超過|最多/.test(value || "");
  }

  function addFieldGroup(raw, remaining, intent, label, keys, terms) {
    if (!terms.some((term) => containsTerm(raw, term))) return remaining;
    intent.fieldGroups.push({ keys, terms: terms.map((term) => term.toLowerCase()), label });
    if (!intent.labels.includes(label)) intent.labels.push(label);
    return terms.reduce((next, term) => removeTerm(next, term), remaining);
  }

  function escapeRegExp(value) {
    return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function text(value) {
    return String(value ?? "");
  }

  function extractNumbers(value) {
    if (value == null) return [];
    return Array.from(String(value).matchAll(/\d+(?:\.\d+)?/g)).map((match) => Number(match[0]));
  }

  function renderBadges(item) {
    return flagOptions
      .filter((flag) => item._flags?.[flag.key])
      .slice(0, 5)
      .map((flag) => `<span class="badge">${escapeHtml(flag.label)}</span>`)
      .join("");
  }

  function specBox(label, value) {
    return `
      <div class="spec-box">
        <span>${escapeHtml(label)}</span>
        <strong>${escapeHtml(value || "-")}</strong>
      </div>
    `;
  }

  function twoLine(primary, secondary) {
    return `${escapeHtml(primary || "-")}<div class="muted mini">${escapeHtml(secondary || "")}</div>`;
  }

  function linkify(key, value) {
    if (key === fields.url && value) {
      return `<a href="${escapeAttr(value)}" target="_blank" rel="noreferrer">${escapeHtml(value)}</a>`;
    }
    return escapeHtml(value);
  }

  function csvCell(value) {
    const normalized = String(value ?? "").replace(/\r?\n/g, " ");
    return `"${normalized.replace(/"/g, '""')}"`;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(value) {
    return escapeHtml(value);
  }
})();
